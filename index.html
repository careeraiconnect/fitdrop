        <span class="bg-indigo-600 group-hover:bg-indigo-700 text-white p-2 rounded-xl text-lg font-black tracking-wider transition">FD</span>
        <span class="text-2xl font-black tracking-tight text-gray-900">Fit<span class="text-indigo-600 group-hover:text-indigo-700 transition">Drop</span></span>
      </a>

        <!-- Guest State (Log In / Sign Up) -->
        <div id="nav-user-section" class="flex items-center space-x-3">
          <button id="nav-login-btn" class="px-4 py-2 text-sm font-semibold text-indigo-600 hover:text-indigo-700">Log In</button>
          <button id="nav-signup-btn" class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg shadow hover:bg-indigo-700 transition">Sign Up</button>

          <span id="user-display-name" class="font-medium text-xs sm:text-sm text-gray-800">User</span>
          <button id="logout-btn" class="ml-1 text-xs bg-white hover:bg-rose-50 hover:text-rose-600 border border-gray-200 text-gray-600 font-semibold px-2.5 py-1 rounded-full transition shadow-xs">Sign Out</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Filter & Controls Toolbar -->

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-gray-200 pb-4">
      <div class="flex items-center gap-2">
        <button class="gender-chip active bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-sm transition" data-gender="all">All Drops</button>
        <button class="gender-chip bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 text-xs font-bold px-4 py-2 rounded-xl transition" data-gender="Men">Men</button>
        <button class="gender-chip bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 text-xs font-bold px-4 py-2 rounded-xl transition" data-gender="Women">Women</button>
      </div>

      <!-- Budget Selector & Counter -->
      <div class="flex items-center gap-3 self-end sm:self-auto">
        <div class="flex items-center gap-2 bg-white border border-gray-300 rounded-xl px-3 py-2 shadow-xs">
          <i class="ph ph-currency-inr text-gray-500 text-sm"></i>
          <label for="budget-filter" class="text-xs font-medium text-gray-500">Max Budget:</label>
          <select id="budget-filter" class="text-xs font-bold text-gray-800 bg-transparent focus:outline-none cursor-pointer">
            <option value="all">Any Price</option>
            <option value="1000">Under ₹1,000</option>
            <option value="2000">Under ₹2,000</option>
            <option value="3500">Under ₹3,500</option>
            <option value="5000">Under ₹5,000</option>
          </select>
        </div>

        <span id="drops-counter" class="text-xs text-gray-400 font-semibold uppercase tracking-wider hidden sm:inline">Showing Drops</span>
      </div>
    </div>

    <!-- Row 2: Sub-Category Pills (Upper, Lower, Shoes, Watches, Outfits) -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2">
      <button class="cat-chip active bg-gray-900 text-white text-xs font-semibold px-4 py-1.5 rounded-full whitespace-nowrap shadow-sm" data-category="all">Everything</button>
      <button class="cat-chip bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 text-xs font-semibold px-4 py-1.5 rounded-full whitespace-nowrap transition" data-category="upper">Upper Wear</button>
      <button class="cat-chip bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 text-xs font-semibold px-4 py-1.5 rounded-full whitespace-nowrap transition" data-category="lower">Lower Wear</button>

            <option value="Women">Women's Fashion</option>

    const toggleAuthModeBtn = document.getElementById('toggle-auth-mode');

    // Filter Engine
    function renderFilteredDrops() {
      outfitGrid.innerHTML = '';

      const filtered = DROPS.filter(item => {
        const matchesGender = (selectedGender === 'all') || (item.gender === selectedGender);
        const matchesCategory = (selectedCategory === 'all') || (item.type === selectedCategory);

        let matchesBudget = true;
        if (selectedBudget !== 'all') {
          matchesBudget = item.price <= parseInt(selectedBudget, 10);
        }

        return matchesGender && matchesCategory && matchesBudget;
      });

      dropsCounter.innerText = `Showing ${filtered.length} Drops`;

      if (filtered.length === 0) {
        outfitGrid.innerHTML = `
          <div class="col-span-full py-16 text-center">
            <i class="ph ph-sliders-horizontal text-4xl text-gray-300 mb-2"></i>
            <p class="text-sm font-semibold text-gray-600">No items match this combination.</p>
            <button id="reset-filters" class="mt-3 text-xs text-indigo-600 font-bold hover:underline">Reset Filters</button>
          </div>
        `;
        document.getElementById('reset-filters')?.addEventListener('click', resetAllFilters);
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md transition flex flex-col group";
        card.innerHTML = `
          <div class="relative h-64 overflow-hidden bg-gray-100">

                <span>${item.type.replace('-', ' ')}</span>
              </div>
              <h3 class="font-bold text-gray-900 text-sm line-clamp-1 group-hover:text-indigo-600 transition">${item.title}</h3>

            </a>
          </div>
        `;

      selectedGender = 'all';
      selectedCategory = 'all';
      selectedBudget = 'all';
      budgetFilter.value = 'all';

      updateGenderUI('all');
      updateCategoryUI('all');
      renderFilteredDrops();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Logo Click -> Return to Default Home View
    brandLogo.addEventListener('click', (e) => {
      e.preventDefault();
      resetAllFilters();
    });

    // UI State Helpers
    function updateGenderUI(gender) {
      document.querySelectorAll('.gender-chip').forEach(btn => {
        if (btn.getAttribute('data-gender') === gender) {
          btn.className = "gender-chip active bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-sm transition";
        } else {
          btn.className = "gender-chip bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 text-xs font-bold px-4 py-2 rounded-xl transition";
        }
      });
    }

          btn.className = "cat-chip active bg-gray-900 text-white text-xs font-semibold px-4 py-1.5 rounded-full whitespace-nowrap shadow-sm";
        } else {
          btn.className = "cat-chip bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 text-xs font-semibold px-4 py-1.5 rounded-full whitespace-nowrap transition";
        }
      });
    }

    // Event Listeners for Genders
    document.querySelectorAll('.gender-chip').forEach(btn => {
      btn.addEventListener('click', (e) => {
        selectedGender = e.currentTarget.getAttribute('data-gender');
        updateGenderUI(selectedGender);
        renderFilteredDrops();
      });
    });

    // Event Listeners for Categories
    document.querySelectorAll('.cat-chip').forEach(btn => {
      btn.addEventListener('click', (e) => {
        selectedCategory = e.currentTarget.getAttribute('data-category');
        updateCategoryUI(selectedCategory);
        renderFilteredDrops();
      });
    });

    // Budget Listener
    budgetFilter.addEventListener('change', (e) => {
      selectedBudget = e.target.value;
      renderFilteredDrops();
    });

    // Auth Modals
    function openAuthModal(signup = false) {
      isSignUpMode = signup;
      authModalTitle.innerText = isSignUpMode ? "Join FitDrop" : "Welcome Back";
      authSubmitBtn.innerText = isSignUpMode ? "Create Account" : "Sign In";
      toggleAuthModeBtn.innerText = isSignUpMode ? "Already have an account? Log in" : "Don't have an account? Sign up";
      authError.classList.add('hidden');
      authModal.classList.remove('hidden');
    }

    document.getElementById('nav-login-btn').addEventListener('click', () => openAuthModal(false));
    document.getElementById('nav-signup-btn').addEventListener('click', () => openAuthModal(true));
    document.getElementById('close-auth-modal').addEventListener('click', () => authModal.classList.add('hidden'));

    toggleAuthModeBtn.addEventListener('click', () => {
      openAuthModal(!isSignUpMode);
    });

    // Check Profile in Firestore
    async function checkUserProfile(user) {
      try {
        const userDocRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(userDocRef);

        if (docSnap.exists()) {
          currentUserProfile = docSnap.data();
          userDisplayName.innerText = currentUserProfile.name;

          if (currentUserProfile.gender && currentUserProfile.gender !== 'All') {
            selectedGender = currentUserProfile.gender;
            updateGenderUI(selectedGender);
            renderFilteredDrops();
          }
        } else {
          document.getElementById('ob-name').value = user.displayName || '';
          onboardingModal.classList.remove('hidden');
        }
      } catch (err) {
        console.error("Firestore retrieval error:", err);
      }
    }

    // Onboarding Form Submit
    document.getElementById('onboarding-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const name = document.getElementById('ob-name').value.trim();
      const age = document.getElementById('ob-age').value.trim();
      const gender = document.getElementById('ob-gender').value;

      try {
        await setDoc(doc(db, "users", currentUser.uid), {
          name: name,
          age: parseInt(age, 10),
          gender: gender,
          email: currentUser.email,
          createdAt: new Date().toISOString()
        });

        onboardingModal.classList.add('hidden');
        currentUserProfile = { name, age, gender };
        userDisplayName.innerText = name;

        if (gender !== 'All') {
          selectedGender = gender;
          updateGenderUI(gender);
          renderFilteredDrops();
        }
      } catch (err) {
        console.error("Error saving profile:", err);
        alert("Failed to save profile: " + err.message);
      }
    });

    // Google Sign-In
    document.getElementById('google-login-btn').addEventListener('click', async () => {
      try {
        authError.classList.add('hidden');
        const res = await signInWithPopup(auth, googleProvider);
        authModal.classList.add('hidden');
        await checkUserProfile(res.user);
      } catch (err) {
        authError.innerText = err.message;
        authError.classList.remove('hidden');
      }
    });

    // Email/Password Sign-In
    emailAuthForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;

      try {
        authError.classList.add('hidden');
        let res;
        if (isSignUpMode) {
          res = await createUserWithEmailAndPassword(auth, email, pass);
        } else {
          res = await signInWithEmailAndPassword(auth, email, pass);
        }
        authModal.classList.add('hidden');
        await checkUserProfile(res.user);
      } catch (err) {
        authError.innerText = err.message;
        authError.classList.remove('hidden');
      }
    });

    // Sign Out
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut(auth);
      location.reload();
    });

    // Firebase Auth State Observer
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        navUserSection.classList.add('hidden');
        userPill.classList.remove('hidden');
        userPill.classList.add('flex');
        await checkUserProfile(user);
      } else {
        navUserSection.classList.remove('hidden');
        userPill.classList.add('hidden');
        userPill.classList.remove('flex');
      }
    });

    // Initial render
    renderFilteredDrops();
  </script>
</body>
</html>
